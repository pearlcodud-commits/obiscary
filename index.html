<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>그래프 귀신 오비</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0b0616;font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.stroke{text-shadow:0 2px 0 #000,0 0 3px #000,2px 0 0 #000,-2px 0 0 #000,0 -2px 0 #000}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud button{pointer-events:auto}
#secBox{position:absolute;left:10px;top:10px;background:rgba(10,5,25,.62);border:2px solid rgba(190,120,255,.6);border-radius:12px;padding:8px 12px;min-width:250px;max-width:46vw;box-shadow:0 0 18px rgba(170,80,255,.35)}
#secName{font-size:18px}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.15);margin:6px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff3df2,#ff9a3c);transition:width .4s;box-shadow:0 0 10px #ff3df2}
#secSub{font-size:14px;opacity:.9}
#coinBox{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(10,5,25,.62);border:2px solid #ffcf3a;border-radius:999px;padding:6px 18px;font-size:22px;box-shadow:0 0 16px rgba(255,200,40,.45)}
#coinBox.hit{animation:shk .45s;border-color:#ff3b3b;color:#ff8080}
#coinBox.gain{animation:pop .35s}
#mapBox{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{width:160px;height:160px;border-radius:50%;border:3px solid rgba(190,120,255,.8);background:rgba(10,5,25,.75);box-shadow:0 0 18px rgba(170,80,255,.5)}
.mbtns{display:flex;gap:6px}
.hb{border:2px solid rgba(255,255,255,.5);background:rgba(10,5,25,.7);color:#fff;font:inherit;font-size:15px;border-radius:10px;padding:6px 10px;cursor:pointer}
#chat{position:absolute;left:10px;top:118px;width:min(420px,60vw);display:flex;flex-direction:column;gap:4px}
.cm{background:rgba(10,5,25,.6);border-left:4px solid #b57bff;border-radius:8px;padding:6px 10px;font-size:16px;line-height:1.4;animation:cin .3s;transition:opacity .8s}
.cm b{color:#ffd23f}
#zoomB{position:absolute;right:10px;top:236px;font-size:16px;border-color:#ffd23f;animation:pulse 1s infinite}
#banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);text-align:center;opacity:0}
#banner.on{animation:ban 3s forwards}
#banner .b1{font-size:clamp(20px,3vw,30px);color:#ffb3ff}
#banner .b2{font-size:clamp(36px,6vw,66px);color:#fff;text-shadow:0 0 20px #ff3df2,0 4px 0 #000}
.popf{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:40px;pointer-events:none;z-index:30;animation:popf 1.2s forwards;white-space:nowrap}
#tip{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 14px;border-radius:10px;font-size:14px;z-index:5;pointer-events:none}
#joy{position:fixed;left:3vw;bottom:5vh;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.4);z-index:8;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:rgba(255,255,255,.75)}
#jumpB,#runB{position:fixed;z-index:8;border-radius:50%;border:3px solid rgba(255,255,255,.6);background:rgba(255,255,255,.18);color:#fff;font:inherit;touch-action:none}
#jumpB{right:4vw;bottom:6vh;width:96px;height:96px;font-size:40px}
#runB{right:calc(4vw + 106px);bottom:5vh;width:66px;height:66px;font-size:26px}
#runB.on{background:rgba(255,160,60,.6)}
#scare{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:radial-gradient(circle,rgba(40,0,30,.2),rgba(0,0,0,.9));pointer-events:none}
#scare.on{display:grid;animation:shk .5s}
#scare .face{width:min(78vmin,600px);animation:scin .7s cubic-bezier(.2,1.5,.4,1) forwards}
#scare .stxt{position:absolute;bottom:12%;font-size:clamp(50px,11vw,120px);color:#fff;text-shadow:0 0 20px #f00,0 6px 0 #000;animation:scin .5s}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40;transition:opacity .35s}
#flash{position:fixed;inset:0;pointer-events:none;z-index:41;opacity:0}
#flash.g{background:radial-gradient(circle,rgba(120,255,160,.5),transparent 70%);animation:fl .7s}
#flash.r{background:radial-gradient(circle,transparent 30%,rgba(255,0,40,.55));animation:fl .7s}
#flash.w{background:rgba(255,240,255,.8);animation:fl .6s}
.panel{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(5,0,15,.7)}
.pbox{background:linear-gradient(#1d1035,#120a24);border:3px solid #b57bff;border-radius:18px;padding:20px 22px;width:min(420px,92vw);box-shadow:0 0 40px rgba(170,80,255,.5);text-align:center}
.pbox h2{font-size:28px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0;font-size:18px}
.row input[type=range]{flex:1;accent-color:#ff3df2}
.gbtn{border:0;border-radius:12px;padding:12px 22px;font:inherit;font-size:20px;color:#fff;cursor:pointer;background:linear-gradient(#3ee07a,#1fae55);box-shadow:0 5px 0 #137a3a;margin:6px}
.gbtn.p{background:linear-gradient(#c084fc,#9333ea);box-shadow:0 5px 0 #6b21a8}
.tog{min-width:90px}
#title{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,rgba(60,10,90,.55),rgba(5,0,15,.92))}
.tc{text-align:center;padding:16px}
.logo{font-size:clamp(44px,9vw,96px);line-height:1;color:#fff;text-shadow:0 0 24px #ff3df2,0 0 6px #fff,0 6px 0 #4a0a5a,0 10px 0 #2a0535}
.logo span{display:block;color:#ffb23f;text-shadow:0 0 24px #ff6a00,0 6px 0 #5a2a00}
.tsub{font-size:20px;margin:16px 0;opacity:.95}
#nameI{font:inherit;font-size:22px;padding:10px 14px;border-radius:12px;border:3px solid #b57bff;background:#1a0f30;color:#fff;text-align:center;width:min(280px,80vw);outline:none;margin-bottom:12px}
.load{font-size:14px;opacity:.7;margin-top:12px}
#zoomV{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.85);display:grid;place-items:center}
#zoomV img{max-width:96vw;max-height:86vh;border-radius:12px;box-shadow:0 0 30px #b57bff}
#err{position:fixed;inset:0;display:none;place-items:center;z-index:99;background:#203;color:#fff;font-size:20px;text-align:center;padding:20px}
@keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-12px,6px)}40%{transform:translate(10px,-8px)}60%{transform:translate(-8px,-4px)}80%{transform:translate(6px,8px)}}
#coinBox.hit{animation:shk2 .45s}
@keyframes shk2{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 10px))}75%{transform:translateX(calc(-50% + 10px))}}
@keyframes pop{50%{transform:translateX(-50%) scale(1.2)}}
@keyframes cin{from{opacity:0;transform:translateX(-20px)}}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
@keyframes popf{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
@keyframes scin{from{transform:scale(.1) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes fl{from{opacity:1}to{opacity:0}}
@keyframes pulse{50%{filter:brightness(1.4)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
 <div id="secBox" class="stroke"><div id="secName"></div><div class="bar"><i id="secBar"></i></div><div id="secSub"></div></div>
 <div id="coinBox" class="stroke">🪙 <b id="coinN">0</b></div>
 <div id="mapBox"><canvas id="mini" width="160" height="160"></canvas><div class="mbtns"><button class="hb" id="viewB">👁 1인칭</button><button class="hb" id="setB">⚙️</button></div></div>
 <div id="chat" class="stroke"></div>
 <button class="hb hidden stroke" id="zoomB">🔍 문제 크게 보기 (Q)</button>
 <div id="banner"><div class="b1 stroke" id="ban1"></div><div class="b2" id="ban2"></div></div>
</div>
<div id="tip" class="hidden stroke">🖱 화면 클릭 = 마우스로 시점 회전 (ESC 해제) · WASD 이동 · SPACE 점프 · SHIFT 달리기 · V 시점</div>
<div id="joy" class="hidden"><div id="knob"></div></div><button id="jumpB" class="hidden">⤒</button><button id="runB" class="hidden">🏃</button>
<div id="scare"></div><div id="fade"></div><div id="flash"></div>
<div id="title"><div class="tc"><div class="logo">그래프 귀신<span>OBBY</span></div><div class="tsub stroke">지우개 귀신이 먹어 버린 꺾은선그래프를 되찾아라!<br>정답 발판으로 점프… 틀리면 용암으로 💀</div><input id="nameI" maxlength="8" placeholder="닉네임"><br><button class="gbtn" id="playB">▶ 플레이</button><div class="load" id="loadT">3D 월드 불러오는 중…</div></div></div>
<div id="settings" class="panel hidden"><div class="pbox"><h2>⚙️ 설정</h2>
 <div class="row">🎵 배경음악<input type="range" id="bgmR" min="0" max="1" step=".05"></div>
 <div class="row">🔊 효과음<input type="range" id="sfxR" min="0" max="1" step=".05"></div>
 <div class="row">🖱 마우스 감도<input type="range" id="senR" min=".3" max="2" step=".1"></div>
 <div class="row">👻 깜짝 놀람(왁!)<button class="hb tog" id="scareT"></button></div>
 <div class="row">👁 시점<button class="hb tog" id="viewT"></button></div>
 <button class="gbtn p" id="setClose">닫기</button></div></div>
<div id="zoomV" class="hidden"><img id="zoomI" alt="문제"></div>
<div id="err">3D 엔진을 불러오지 못했어요 😢<br>인터넷 연결을 확인하고 새로고침해 주세요.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1);return w+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?a:b)};
const fmt=v=>{v=Math.round(v*100)/100;return v>=1000?v.toLocaleString('ko-KR'):String(v)};
const T1={hw:'높은',lw:'낮은',uw:'오른',dw:'내려간'};
const CTX=[
{t:'시각별 오늘의 기온',x:'시각',y:'기온',u:'℃',xs:'time',step:1,shape:'hill',lo:8,hi:27,col:'b',...T1},
{t:'시각별 교실의 온도',x:'시각',y:'온도',u:'℃',xs:'time',step:1,shape:'hill',lo:10,hi:24,col:'b',...T1},
{t:'시각별 수영장 물의 온도',x:'시각',y:'온도',u:'℃',xs:'time',step:1,shape:'hill',lo:18,hi:31,col:'b',...T1},
{t:'요일별 운동장의 온도',x:'요일',y:'온도',u:'℃',xs:'weekday',step:1,shape:'wave',lo:5,hi:22,col:'b',...T1},
{t:'월별 새끼 고양이의 무게',x:'월',y:'무게',u:'kg',xs:'month',step:.1,shape:'up',lo:.3,hi:2.4,col:'g',hw:'무거운',lw:'가벼운',uw:'늘어난',dw:'줄어든'},
{t:'주별 방울토마토 줄기의 길이',x:'주',y:'길이',u:'cm',xs:'week',step:2,shape:'up',lo:2,hi:40,col:'g',hw:'긴',lw:'짧은',uw:'자란',dw:'줄어든'},
{t:'날짜별 해바라기의 키',x:'날짜',y:'키',u:'cm',xs:'day',step:5,shape:'up',lo:10,hi:120,col:'g',hw:'큰',lw:'작은',uw:'자란',dw:'줄어든'},
{t:'연도별 우리 학교 학생 수',x:'연도',y:'학생 수',u:'명',xs:'year',step:10,shape:'down',lo:300,hi:560,col:'b',hw:'많은',lw:'적은',uw:'늘어난',dw:'줄어든'},
{t:'월별 강아지의 키',x:'월',y:'키',u:'cm',xs:'month',step:1,shape:'up',lo:22,hi:48,col:'g',hw:'큰',lw:'작은',uw:'자란',dw:'줄어든'},
{t:'시각별 막대 그림자의 길이',x:'시각',y:'길이',u:'cm',xs:'time',step:10,shape:'valley',lo:40,hi:220,col:'b',hw:'긴',lw:'짧은',uw:'늘어난',dw:'줄어든'},
{t:'월별 저금통에 모은 돈',x:'월',y:'금액',u:'원',xs:'month',step:500,shape:'up',lo:1000,hi:15000,col:'g',hw:'많은',lw:'적은',uw:'늘어난',dw:'줄어든'},
{t:'월별 도서관 대출 책 수',x:'월',y:'책 수',u:'권',xs:'month',step:2,shape:'wave',lo:10,hi:58,col:'b',hw:'많은',lw:'적은',uw:'늘어난',dw:'줄어든'},
];
const XU={time:'시',month:'월',week:'주',day:'일',year:'년',weekday:''};
function labelOf(c,n){switch(c.xs){
 case 'time':return n<12?{s:''+n,sub:'오전',f:`오전 ${n}시`}:n===12?{s:'12',sub:'낮',f:'낮 12시'}:{s:''+(n-12),sub:'오후',f:`오후 ${n-12}시`};
 case 'month':return{s:''+n,f:n+'월'};case 'week':return{s:''+n,f:n+'주'};case 'day':return{s:''+n,f:n+'일'};case 'year':return{s:''+n,f:n+'년'};
 default:return{s:'월화수목금'[n],f:'월화수목금'[n]+'요일'}}}
function genNums(c,n,iv){let st=0,d=iv;
 if(c.xs==='time')st=iv===1?R(9,10):9;else if(c.xs==='month')st=iv===1?R(3,6):3;else if(c.xs==='week')st=1;else if(c.xs==='day'){st=1;d=3*iv}else if(c.xs==='year')st=iv===1?R(2018,2020):2016;
 return Array.from({length:n},(_,i)=>st+i*d)}
function genSeries(c,n,shape){const loK=Math.round(c.lo/c.step),hiK=Math.round(c.hi/c.step),span=hiK-loK,mi=Math.max(1,Math.round(span/(n-1)*.9));
 for(let t=0;t<300;t++){let ks,k;
  if(shape==='up'||shape==='down'){k=R(loK,loK+Math.floor(span/4));ks=[k];for(let i=1;i<n;i++){k+=R(1,mi);ks.push(k)}if(shape==='down')ks.reverse()}
  else if(shape==='hill'||shape==='valley'){const p=R(1,n-2);k=R(loK,loK+Math.floor(span/3));ks=[k];for(let i=1;i<n;i++){k+=i<=p?R(1,mi):-R(1,mi);ks.push(k)}if(shape==='valley')ks=ks.map(v=>loK+hiK-v)}
  else{k=R(loK+Math.floor(span/4),hiK-Math.floor(span/4));ks=[k];for(let i=1;i<n;i++){k+=(Math.random()<.5?-1:1)*R(1,mi);ks.push(k)}}
  if(ks.every(v=>v>=loK&&v<=hiK))return ks}
 return Array.from({length:n},(_,i)=>loK+i)}
function makeGraph(o={}){const c=o.c||pick(CTX.filter(o.filter||(()=>true)));const iv=o.iv||1;const n=o.n||(c.xs==='weekday'?5:R(4,6));
 const nums=genNums(c,n,iv),xs=nums.map(v=>labelOf(c,v)),ks=genSeries(c,n,o.shape||c.shape);
 const maxK=Math.max(...ks),minK=Math.min(...ks);const yMaxK=(Math.floor(maxK/5)+1)*5;const yMinK=minK>=20?(Math.floor(minK/5)-1)*5:0;
 return{c,nums,xs,ks,yMinK,yMaxK,wave:yMinK>0,kind:'line',hide:-1}}
const V=(g,k)=>fmt(k*g.c.step)+g.c.u;
const ie=w=>josa(w,'이에요','예요');
function numChoices(k,g){const set=new Set([k]);for(const d of shuffle([1,-1,2,-2,5,-5,3,-3,10])){if(set.size>=4)break;if(k+d>=0)set.add(k+d)}return shuffle([...set]).map(x=>V(g,x))}
const LINE_S=['하루 동안 운동장 기온의 변화','1년 동안 내 키의 변화','월별 강아지 몸무게의 변화','주별 콩나물 키의 변화','연도별 우리 마을 인구의 변화','시각별 교실 온도의 변화','요일별 줄넘기 기록의 변화'];
const BAR_S=['좋아하는 과일별 학생 수','반별 안경 쓴 학생 수','마을별 나무의 수','좋아하는 운동별 학생 수','취미별 학생 수','동물원의 동물별 마릿수','반별 모은 빈 병의 수'];
const updn=c=>c.u==='℃'?['올라갔어요','내려갔어요']:['늘어났어요','줄어들었어요'];
function uniqExt(hi){for(let t=0;t<60;t++){const g=makeGraph();const m=hi?Math.max(...g.ks):Math.min(...g.ks);if(g.ks.filter(k=>k===m).length===1)return[g,g.ks.indexOf(m)]}const g=makeGraph({shape:'up'});return[g,hi?g.ks.length-1:0]}
const GEN={
title(){const g=makeGraph();const others=shuffle(CTX.filter(c=>c.t!==g.c.t&&!(c.x===g.c.x&&c.y===g.c.y))).slice(0,3).map(c=>c.t);
 return{p:'🔍 앗! 그래프 제목이 사라졌어요. 무엇을 조사하여 나타낸 그래프일까요?',g,hideTitle:1,ch:shuffle([g.c.t,...others]),a:g.c.t,e:`가로는 <b>${g.c.x}</b>, 세로는 <b>${g.c.y}(${g.c.u})</b>예요. 그래서 '${g.c.t}' 그래프랍니다.`}},
axis(){const g=makeGraph();const isX=Math.random()<.5;const a=isX?g.c.x:g.c.y,o=isX?g.c.y:g.c.x;const pool=shuffle([...new Set(CTX.flatMap(c=>[c.x,c.y]))].filter(w=>w!==a&&w!==o)).slice(0,2);
 return{p:`그래프의 <b>${isX?'가로':'세로'}</b>는 무엇을 나타내나요?`,g,ch:shuffle([a,o,...pool]),a,e:`왼쪽 아래 칸을 보세요! 가로는 <b>${g.c.x}</b>, 세로는 <b>${g.c.y}</b>를 나타내요.`}},

 const r=sec.respawns[idx]||sec.respawns[0];P.pos.copy(r.pos);P.vel.set(0,0,0);P.dead=0;P.grounded=false;P.lastGY=r.pos.y;camFreeze=null;yaw=0;P.face=Math.PI;SND.respawn();$('#fade').style.opacity=0;puff(P.pos,10,0x40f0ff)}
function resetGate(gt){gt.plats.forEach(pl=>{pl.fall=0;pl.s.off=false;setSolid(pl.s,pl.s.base.x,pl.s.base.y,pl.s.base.z);pl.sg.position.y=pl.s.base.y+2.6;pl.post.position.y=pl.s.base.y+.8;pl.mat.emissive.set(SIGNHEX[pl.i]);pl.mat.emissiveIntensity=.35});assignChoices(gt);gt.seen=0}
// ================= section flow =================
function enterSection(k,first){disposeSection();buildSection(k);S.sec=k;save();const r=sec.respawns[0];P.pos.copy(r.pos);P.vel.set(0,0,0);P.dead=0;yaw=0;P.face=Math.PI;
 const pz=sec.portal?sec.portal.z:-100;intro={t:0,dur:first?3.2:2.6,from:new V3(14,30,pz*.55),look:new V3(0,0,pz*.4)};camera.position.copy(intro.from);
 SND.zone();flash('w');const info=sec.info;banner(info.tut?'시작':(info.endless?'무한 모드':`구간 ${k} / ${LAST}`),`${info.icon} ${info.name}`);
 info.intro.forEach((l,i)=>setTimeout(()=>chat(l.replace(/\{name\}/g,S.name)),900+i*2200));if(!info.tut&&Math.random()<.5)setTimeout(()=>scare(true),2800);updHud()}
function nextSection(){if(P.dead||P.porting)return;P.porting=1;SND.portal();$('#fade').style.opacity=1;
 setTimeout(()=>{const k=sec.k+1;if(sec.k===LAST&&!S.cleared){S.cleared=1;save();setTimeout(finale,400)}if(k>LAST)S.best=Math.max(S.best,k-LAST);enterSection(k);$('#fade').style.opacity=0;P.porting=0},700)}
function finale(){SND.final();flash('w');banner('🏆 모든 그래프를 되찾았다!',`${S.name} = 그래프 마스터`);for(let i=0;i<4;i++)setTimeout(()=>popf(pick(['🎉','🏆','✨','👻','📈']),pick(['#ff3df2','#ffd23f','#40f0ff']),80),i*350);chat('해냈어!! 지우개 귀신이 도망갔어! 이제 <b>무한 귀신 탑</b>에서 실력을 더 키워 봐! 👻💜');addCoins(500)}
function updHud(){if(!sec)return;const info=sec.info,solved=sec.gates.filter(g=>g.solved).length,n=sec.gates.length;
 $('#secName').textContent=`${info.icon} ${info.tut?'':info.endless?'∞ · ':`구간 ${sec.k}/${LAST} · `}${info.name}`;
 const prog=info.tut?0:info.endless?100:Math.round(((sec.k-1)+solved/n)/LAST*100);$('#secBar').style.width=(info.tut?solved/n*100:info.endless?solved/n*100:prog)+'%';
 $('#secSub').textContent=`문제 ${solved}/${n}${info.tut?' (연습)':info.endless?` · 최고 ${S.best}층`:` · 전체 진행률 ${prog}%`}`;coinsUI()}
// ================= input =================
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.code]=1;if(e.code==='Space'){e.preventDefault();if(!e.repeat)jumpQ=true}if(e.code==='KeyV')toggleView();if(e.code==='KeyQ')zoomBoard()});
addEventListener('keyup',e=>keys[e.code]=0);addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
const locked=()=>document.pointerLockElement===canvas;
canvas.addEventListener('click',()=>{if(started&&!coarse&&!locked()){try{const r=canvas.requestPointerLock();r&&r.catch&&r.catch(()=>{})}catch(e){}}});
let drag=null;canvas.addEventListener('pointerdown',e=>{if(!started)return;if(e.pointerType==='touch'||!locked())drag={id:e.pointerId,x:e.clientX,y:e.clientY}});
addEventListener('pointermove',e=>{if(!started)return;let mx=0,my=0;if(locked()){mx=e.movementX;my=e.movementY}else if(drag&&drag.id===e.pointerId){mx=e.clientX-drag.x;my=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;mx*=1.6;my*=1.6}else return;
 const k=.0024*S.sens;yaw-=mx*k;if(S.fp)pitchF=clamp(pitchF-my*k,-1.35,1.35);else pitchT=clamp(pitchT+my*k,-.15,1.25)});
addEventListener('pointerup',e=>{if(drag&&drag.id===e.pointerId)drag=null});
addEventListener('wheel',e=>{dist=clamp(dist+e.deltaY*.01,5,18)},{passive:true});
(()=>{const j=$('#joy'),k=$('#knob');let id=null;const mv=e=>{const r=j.getBoundingClientRect();let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;const d=Math.hypot(dx,dy),m=55;if(d>m){dx*=m/d;dy*=m/d}k.style.transform=`translate(${dx}px,${dy}px)`;joy={x:dx/m,y:dy/m}};
j.addEventListener('pointerdown',e=>{e.stopPropagation();id=e.pointerId;j.setPointerCapture(id);mv(e)});j.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e)});const up=()=>{id=null;joy={x:0,y:0};k.style.transform=''};j.addEventListener('pointerup',up);j.addEventListener('pointercancel',up);
 $('#jumpB').addEventListener('pointerdown',e=>{e.stopPropagation();jumpQ=true});$('#runB').addEventListener('pointerdown',e=>{e.stopPropagation();running=!running;$('#runB').classList.toggle('on',running)})})();
function toggleView(){S.fp=S.fp?0:1;save();$('#viewB').textContent=S.fp?'👁 3인칭':'👁 1인칭';$('#viewT').textContent=S.fp?'1인칭':'3인칭';chat(S.fp?'1인칭 시점! 🔦 손전등이 켜졌어':'3인칭 시점!')}
$('#viewB').onclick=toggleView;
function zoomBoard(){const gt=sec&&sec.gates.find(g=>!g.solved&&Math.abs(P.pos.z-g.start.min.z)<30);if(!gt)return;$('#zoomI').src=gt.cv.toDataURL();$('#zoomV').classList.remove('hidden');document.exitPointerLock&&document.exitPointerLock()}
$('#zoomB').onclick=zoomBoard;$('#zoomV').onclick=()=>$('#zoomV').classList.add('hidden');
const syncSet=()=>{$('#bgmR').value=S.bgm;$('#sfxR').value=S.sfx;$('#senR').value=S.sens;$('#scareT').textContent=S.scare?'켜짐 👻':'꺼짐';$('#viewT').textContent=S.fp?'1인칭':'3인칭'};
$('#setB').onclick=()=>{syncSet();$('#settings').classList.remove('hidden');document.exitPointerLock&&document.exitPointerLock()};$('#setClose').onclick=()=>{$('#settings').classList.add('hidden');save()};
$('#bgmR').oninput=e=>{S.bgm=+e.target.value;applyVol()};$('#sfxR').oninput=e=>{S.sfx=+e.target.value;applyVol();SND.coin()};$('#senR').oninput=e=>S.sens=+e.target.value;
$('#scareT').onclick=()=>{S.scare=S.scare?0:1;syncSet();if(S.scare)scare(true)};$('#viewT').onclick=()=>{toggleView();syncSet()};
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
// ================= minimap =================
const mini=$('#mini'),mg=mini.getContext('2d');
function drawMini(){const W=160,c=W/2,sc=2.2;mg.clearRect(0,0,W,W);mg.save();mg.beginPath();mg.arc(c,c,c-2,0,TAU);mg.clip();mg.fillStyle='rgba(60,10,20,.9)';mg.fillRect(0,0,W,W);
 mg.translate(c,c);mg.rotate(yaw);const px=P.pos.x,pz=P.pos.z;
 for(const s of sec.solids){if(s.off||s.max.z<pz-60||s.min.z>pz+60)continue;const x=(s.min.x-px)*sc,y=(s.min.z-pz)*sc,w=(s.max.x-s.min.x)*sc,h=(s.max.z-s.min.z)*sc;
  mg.fillStyle=s.answer?SIGNCOL[s.answer.plats.findIndex(p=>p.s===s)]:s.respawn!=null?(s.respawn<=sec.cur?'#3dff8b':'#40f0ff'):s.key?'#b57bff':s.mat==='rubber'?'#3dff8b':s.mat==='metal'?'#9aa6c0':'#8a8098';mg.fillRect(x,y,Math.max(1,w),Math.max(1,h))}
 if(sec.portal){mg.fillStyle='#ff3df2';mg.beginPath();mg.arc((sec.portal.x-px)*sc,(sec.portal.z-pz)*sc,6,0,TAU);mg.fill()}
 mg.restore();mg.save();mg.translate(c,c);mg.rotate(yaw-(P.face||Math.PI)+Math.PI);mg.fillStyle='#ffd23f';mg.strokeStyle='#000';mg.lineWidth=2;mg.beginPath();mg.moveTo(0,-9);mg.lineTo(6,7);mg.lineTo(0,3);mg.lineTo(-6,7);mg.closePath();mg.fill();mg.stroke();mg.restore();
 mg.fillStyle='#fff';mg.font='12px Jua';mg.textAlign='center';mg.fillText('▲ 앞',c,14)}
// ================= main loop =================
const clock=new THREE.Clock();let gateLook=0,frame=0,tAll=0,playT=0,restWarn=0;
function animate(){requestAnimationFrame(animate);const dt=Math.min(.05,clock.getDelta());if(document.hidden)return;tAll+=dt;frame++;
 if(sec&&started){if(intro){intro.t+=dt;if(intro.t>=intro.dur)intro=null}
  // movers & spinners
  for(const s of sec.movers){const m=s.mover,x=m.bx+Math.sin(tAll*m.sp+m.ph)*m.ax;const ox=s.min.x+s.w/2;setSolid(s,x,m.by,m.bz);s.dp.set(x-ox,0,0)}
  for(const sp of sec.spinners){sp.a+=sp.sp*dt;sp.m.rotation.y=sp.a}
  if(!P.dead){step(dt/2);step(dt/2)}else{P.deadT+=dt;P.pos.addScaledVector(P.vel,dt);P.vel.y-=20*dt;if(P.deadT>.75)respawn()}
  // keys spring
  for(const k of sec.keys){if(k.t<3){k.t+=dt;const o=-.32*Math.exp(-9*k.t)*Math.cos(16*k.t);k.m.position.y=k.baseY+o;const gI=Math.exp(-5*k.t);k.top.emissive.copy(k.glow).multiplyScalar(gI*.9);k.side.emissive.copy(k.glow).multiplyScalar(gI*.7)}}
  // falling answer platforms
  for(const gt of sec.gates)for(const pl of gt.plats)if(pl.fall>0){pl.fall+=dt;if(pl.fall>.18){pl.s.off=true;const dy=-((pl.fall-.18)**2)*22;setSolid(pl.s,pl.s.base.x,pl.s.base.y+dy,pl.s.base.z);pl.sg.position.y=pl.s.base.y+2.6+dy;pl.post.position.y=pl.s.base.y+.8+dy;pl.s.mesh.rotation.z=(pl.fall-.18)*(pl.i%2?1.2:-1.2)}}
  // coins & gifts
  for(const c of sec.coins){if(c.taken)continue;c.m.rotation.z+=dt*3;if(c.m.position.distanceTo(P.pos)<1.6||c.m.position.distanceTo(new V3(P.pos.x,P.pos.y+1.5,P.pos.z))<1.4){c.taken=1;c.m.visible=false;S.coins+=5;save();coinsUI('gain');SND.coin();popf('+5 🪙','#ffd23f',28)}}
  for(const g of sec.gifts){if(g.taken)continue;g.m.rotation.y+=dt*1.5;g.m.position.y+=Math.sin(tAll*3)*.01;if(g.m.position.distanceTo(new V3(P.pos.x,P.pos.y+1.4,P.pos.z))<1.6){g.taken=1;g.m.visible=false;gift()}}
  for(const g of sec.ghosts){g.position.y=g.userData.by+Math.sin(tAll*1.5+g.userData.ph)*.6;g.rotation.y=Math.sin(tAll*.7+g.userData.ph)*.6}
  for(const s of sec.spin)s.m.rotation[s.ax]+=s.s*dt;
  if(sec.portal){sec.portal.disc.rotation.z-=dt*2;sec.portal.ring.rotation.z+=dt;const d=Math.hypot(P.pos.x-sec.portal.x,P.pos.z-sec.portal.z);if(d<2.6&&Math.abs(P.pos.y-sec.portal.y)<3)nextSection()}
  for(const s of sec.solids)if(s.ring)s.ring.rotation.z+=dt;
  // gate near → zoom button
  const near=sec.gates.some(g=>!g.solved&&P.pos.z<g.start.max.z+4&&P.pos.z>g.start.min.z-14);$('#zoomB').classList.toggle('hidden',!near);gateLook+=((near?1:0)-gateLook)*Math.min(1,dt*3);
  playT+=dt;if(playT>1200&&!restWarn){restWarn=1;chat('벌써 20분이나 했네! 👀 눈이 피곤하면 잠깐 쉬었다가 와. 진행은 저장돼!')}}
 updateAvatar(dt);updateCam(dt);
 // environment
 lava.position.x=P.pos.x;lava.position.z=P.pos.z;TX.lava.offset.x=tAll*.02;TX.lava.offset.y=tAll*.013;
 const ep=emb.geometry.attributes.position;for(let i=0;i<ep.count;i++){let y=ep.getY(i)+dt*rr_(1,3);if(y>40)y=0;ep.setY(i,y)}ep.needsUpdate=true;emb.position.set(P.pos.x,lava.position.y,P.pos.z);
 moon.position.set(camera.position.x-120,camera.position.y+90,camera.position.z-260);moonGlow.position.copy(moon.position);
 pLight.position.set(P.pos.x,P.pos.y+5,P.pos.z+2);
 for(const d of dust)if(d.t<.6){d.t+=dt;d.s.position.addScaledVector(d.v,dt);d.s.material.opacity=.7*(1-d.t/.6);d.s.scale.setScalar(.4+d.t*1.4);if(d.t>=.6)d.s.visible=false}
 if(sec&&frame%3===0)drawMini();
 renderer.render(scene,camera)}
function updateAvatar(dt){const a=avatar,v=P.vel,hs=Math.hypot(v.x,v.z);a.g.position.copy(P.pos);let dr=(((P.face||0)-a.g.rotation.y+Math.PI)%TAU+TAU)%TAU-Math.PI;a.g.rotation.y+=dr*Math.min(1,dt*14);
 P.ph=(P.ph||0)+hs*dt*1.35;const sw=Math.sin(P.ph)*Math.min(1,hs/8)*1.0;let aX=-sw,lX=sw,aZ=0;
 if(!P.grounded){if(v.y>0){aX=-2.7;lX=.35}else if(P.air>.55){aX=-2.4+Math.sin(tAll*22)*.6;aZ=Math.sin(tAll*18)*.5;lX=Math.sin(tAll*20)*.6}else{aX=-1.6;lX=.2}}
 const L=(o,t)=>o.rotation.x+=(t-o.rotation.x)*Math.min(1,dt*16);L(a.aL,aX);L(a.aR,!P.grounded?aX:-aX);L(a.lL,lX);L(a.lR,!P.grounded?-lX*.5:-lX);a.aL.rotation.z=aZ;a.aR.rotation.z=-aZ;
 a.body.rotation.x=P.grounded?Math.min(.18,hs/60):0;P.squash*=Math.exp(-dt*10);a.body.scale.set(1+P.squash*.6,1-P.squash,1+P.squash*.6);
 // shadow: highest solid below
 let gy=-1e9;if(sec)for(const s of sec.solids){if(s.off)continue;if(P.pos.x>s.min.x&&P.pos.x<s.max.x&&P.pos.z>s.min.z&&P.pos.z<s.max.z&&s.max.y<=P.pos.y+.05&&s.max.y>gy)gy=s.max.y}
 if(gy>-1e8){shadowBlob.visible=true;const h=P.pos.y-gy;shadowBlob.position.set(P.pos.x,gy+.03,P.pos.z);const k=Math.max(.35,1-h/12);shadowBlob.scale.setScalar(k);shadowBlob.material.opacity=.5*k}else shadowBlob.visible=false;
 a.g.visible=!S.fp||!started}
function updateCam(dt){const pos=P.pos;
 if(!started){const a=tAll*.12;camera.position.set(Math.sin(a)*26,14,-20+Math.cos(a)*26);camera.lookAt(0,2,-24);return}
 if(intro){const k=intro.t/intro.dur,e=k<.5?2*k*k:1-(-2*k+2)**2/2;const behind=new V3(pos.x,pos.y+2.4+Math.sin(pitchT)*dist,pos.z+Math.cos(pitchT)*dist);camera.position.lerpVectors(intro.from,behind,e);const lk=new V3().lerpVectors(intro.look,new V3(pos.x,pos.y+2,pos.z),e);camera.lookAt(lk);return}
 const head=new V3(pos.x,pos.y+2.4,pos.z);
 if(S.fp&&!P.dead){camera.position.set(pos.x,pos.y+2.75,pos.z);const f=new V3(-Math.sin(yaw)*Math.cos(pitchF),Math.sin(pitchF),-Math.cos(yaw)*Math.cos(pitchF));camera.lookAt(camera.position.clone().add(f));
  flashL.intensity=1.6;flashL.position.copy(camera.position);flashL.target.position.copy(camera.position.clone().addScaledVector(f,10))}
 else{flashL.intensity=0;const pt=pitchT-.2*gateLook,dd=dist+2*gateLook;const want=camFreeze||new V3(head.x+Math.sin(yaw)*Math.cos(pt)*dd,head.y+Math.sin(pt)*dd,head.z+Math.cos(yaw)*Math.cos(pt)*dd);camera.position.lerp(want,1-Math.exp(-dt*(camFreeze?2:12)));camera.lookAt(head.x,head.y+gateLook*4.5,head.z)}
 if(camShake>.01){camera.position.x+=(Math.random()-.5)*camShake;camera.position.y+=(Math.random()-.5)*camShake;camShake*=Math.exp(-dt*9)}}
function gift(){const r=Math.random(),tier=r<.03?3:r<.15?2:r<.45?1:0;const amt=[15,40,100,250][tier];addCoins(amt);SND.gift(tier);flash(tier>=2?'w':'g');popf(`🎁 ${['일반','희귀','영웅','전설'][tier]}! +${amt} 🪙`,['#ddd','#60a5fa','#c084fc','#ffb23f'][tier],tier>=2?56:40);chat(`랜덤 상자에서 <b>${['일반','희귀','영웅','전설'][tier]}</b> 보상! 🪙 +${amt}`)}
// ================= start =================
buildSection(Math.min(S.sec,999));P.pos.copy(sec.respawns[0].pos);
if(S.name&&S.name!=='플레이어')$('#nameI').value=S.name;
(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{if(sec)sec.gates.forEach(g=>{assignChoices(g);renderBoard(g,'q')});$('#loadT').textContent=S.sec?`이어하기: ${secInfo(S.sec).icon} ${secInfo(S.sec).name}`:'준비 완료!'});
$('#playB').onclick=()=>{audioInit();const v=$('#nameI').value.trim();S.name=v||'플레이어';save();$('#title').classList.add('hidden');$('#hud').classList.remove('hidden');
 if(coarse){['#joy','#jumpB','#runB'].forEach(s=>$(s).classList.remove('hidden'))}else{$('#tip').classList.remove('hidden');setTimeout(()=>$('#tip').classList.add('hidden'),12000)}
 $('#viewB').textContent=S.fp?'👁 3인칭':'👁 1인칭';started=true;enterSection(S.sec,true);coinsUI()};
coinsUI();requestAnimationFrame(animate);
